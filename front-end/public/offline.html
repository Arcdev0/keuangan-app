<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0056b3" />
    <title>DompetArc Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef2f8;
        color: #111827;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(86vw, 360px);
        border-radius: 18px;
        background: white;
        padding: 28px 22px;
        text-align: center;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.1);
      }

      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        object-fit: contain;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      p {
        margin: 10px 0 0;
        color: #4b5563;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/pwa-icon-192.png" alt="DompetArc" />
      <h1>Kamu sedang offline</h1>
      <p>Buka lagi saat koneksi tersedia agar data transaksi dan saldo tetap sinkron.</p>
    </main>
  </body>
</html>
